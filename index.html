<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natalia & Joel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pantalla">

        <img
            src="img/inicio.png"
            alt="Natalia y Joel - Encontrá tu lugar"
            class="fondo"
        >

        <!-- Campo real para escribir el nombre -->
        <input
            type="text"
            id="nombre"
            class="campo-nombre"
            placeholder=""
            autocomplete="off"
        >

        <!-- Botón real -->
        <button
            id="buscar"
            class="boton-buscar"
            aria-label="Buscar"
        ></button>

    </div>
    <script src="script.js"></script>
</body>
</html>
